name: HubBrowser
options:
  bundleIdPrefix: com.yg
  deploymentTarget:
    iOS: "16.0"

packages:
  SwiftyXrayKit:
    url: https://github.com/dima-u/SwiftyXrayKit
    from: 1.1.0

targets:
  HubBrowser:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    dependencies:
      - package: SwiftyXrayKit
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yg.hubbrowser
        PRODUCT_NAME: HubBrowser
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

schemes:
  HubBrowser:
    build:
      targets:
        HubBrowser: all
    run:
      config: Release
