name: build-ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project HubBrowser.xcodeproj \
            -scheme HubBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/HubBrowser.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/HubBrowser.xcarchive/Products/Applications/HubBrowser.app build/Payload/
          cd build
          zip -r -y HubBrowser.ipa Payload
          ls -lh HubBrowser.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HubBrowser-unsigned-ipa
          path: build/HubBrowser.ipa
          retention-days: 30
